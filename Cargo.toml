[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
kdiff4-core = { path = "crates/kdiff4-core" }
kdiff4-protocol = { path = "crates/kdiff4-protocol" }
kdiff4-gui = { path = "crates/kdiff4-gui" }
thiserror = "2.0.21"
anyhow = "1.0.104"
log = "0.4.35"
flexi_logger = { version = "0.31.10", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
imara-diff = "0.2.0"
encoding_rs = "0.8.44"
chardetng = "1.0.0"
toml = "1.1.8"
dirs = "7.0.0"
egui = "0.37.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
egui_kittest = "0.37.0"
rfd = "0.17.2"
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
insta = "1.49.0"
proptest = "1.12.0"
regex = "1.13.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
semver = "1.0.28"
serde_json = "1.0.154"
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }

[package]
name = "kdiff4"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kdiff4-core.workspace = true
kdiff4-protocol.workspace = true
kdiff4-gui.workspace = true
anyhow.workspace = true
log.workspace = true
flexi_logger.workspace = true
clap.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
